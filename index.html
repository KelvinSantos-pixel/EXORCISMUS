<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Exorcismus</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--f:.3;--gold:#e0b252;--wine:#7a1226;--ink:#05060d;--pap:#d9c8a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#020308;color:#cfd3e6;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
#stage{position:relative;width:100%;aspect-ratio:4/3;flex:none;background:#000}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at center,transparent calc(65% - var(--f)*35%),rgba(0,0,0,.9) 100%),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#cap{position:absolute;left:0;right:0;top:4px;text-align:center;font:11px monospace;color:#9aa;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 0 3px #000}
#ui{flex:1;overflow:auto;padding:10px 12px 16px;background:linear-gradient(#0a0d18,#05060d)}
h1{font-family:'UnifrakturCook','Old English Text MT',Georgia,serif;color:var(--gold);text-align:center;font-size:44px;margin:2px 0;text-shadow:0 0 12px #7a1226,0 2px 0 #000;letter-spacing:1px}
h2{color:var(--gold);font-size:15px;margin:0 0 6px;letter-spacing:.5px}
.sub{text-align:center;color:#8c91ad;font-size:13px;margin:0 0 10px}
p{margin:0 0 8px;line-height:1.45;font-size:14px}
.b{display:block;width:100%;margin:6px 0;padding:11px 10px;background:linear-gradient(#8a1830,#5a0e1f);color:#f3e6c4;border:1px solid #b8923f;border-radius:5px;font:700 14px Georgia,serif;letter-spacing:.5px;cursor:pointer}
.b:active{transform:scale(.98)}
.b.g{background:#0c1020;border-color:#4a4f70;color:#b8bdd8}
.b[disabled]{opacity:.35;cursor:default}
.row{display:flex;gap:6px}.row .b{margin:4px 0}
.box{background:rgba(20,26,48,.85);border:1px solid #2a3050;border-radius:6px;padding:9px 10px;margin:6px 0;animation:fin 1.2s}
.pap{background:var(--pap);color:#2a1d10;border-color:#8a6a35}
.pap h2{color:#6b1020}.pap p{color:#2a1d10}
@keyframes fin{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.bar span{width:78px;color:#aab}.bar i{flex:1;height:9px;background:#0a0c18;border:1px solid #2a3050;display:block;position:relative}
.bar i b{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .4s}
.bar em{width:44px;text-align:right;font-style:normal;font-family:monospace;color:#cfd3e6}
.cl{border-left:3px solid var(--wine);padding:3px 8px;margin:5px 0;font-size:13px}
.dem{padding:9px;margin:5px 0;border:1px solid #8a6a35;border-radius:5px;background:rgba(255,255,255,.35);cursor:pointer;color:#2a1d10}
.dem.on{background:#7a1226;color:#f3e6c4;border-color:#e0b252}
.dem.off{opacity:.4;text-decoration:line-through;cursor:default}
.dem b{display:block;font-size:14px}.dem small{font-size:12px}
.int{text-align:center;padding:7px;border:1px solid var(--wine);background:#12060b;color:#ff9aa8;font-size:13px;margin:6px 0}
.log{min-height:38px;font-size:13px;color:#aeb3cc;font-style:italic}
.gl{animation:gl .25s infinite}
@keyframes gl{0%{text-shadow:2px 0 #f00,-2px 0 #0ff}50%{text-shadow:-2px 0 #f00,2px 0 #0ff;transform:translateX(1px)}100%{text-shadow:none}}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
#cross,#opt{position:absolute;inset:0;background:rgba(2,3,8,.96);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:auto}
#cross canvas{width:min(80vw,320px);height:min(80vw,320px);background:#08091a;border:1px solid #5a0e1f;touch-action:none;border-radius:6px}
#opt{justify-content:flex-start;align-items:stretch}
#opt label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1c2038;font-size:14px}
.gear{position:absolute;right:6px;top:6px;z-index:5;background:rgba(0,0,0,.55);border:1px solid #4a4f70;color:#b8bdd8;border-radius:5px;padding:3px 8px;font-size:15px;cursor:pointer}
.cb .bar i b{filter:hue-rotate(160deg)}
</style>

  cl:"Muitas bocas falando como uma só."},
 {x:124,k:"obj",n:"O altar do pacto",tx:"O pacto original: cinco assinaturas e uma sexta, ilegível. A da própria vila inteira.",

];
const LBL={bla:"Blasfêmia: ataca sua Fé",pos:"Tenta possuir o hospedeiro",fur:"FÚRIA: golpe pesado"};

/* ===== LÓGICA DO RITO ===== */
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function newRite(ci,ok,mercy,feMax){
 const hp=Math.round(DEM[CASES[ci].id].hp*(ok?1:1.25));
 const R={ci,k:CASES[ci].id,ok,hp,max:hp,fe:feMax,feMax,vo:4,voMax:6,po:0,water:3,stun:false,shield:0,ritu:0,cd:0,turn:0,last:"",mercy,over:null,log:[]};
 pickIntent(R);return R;
}
function pickIntent(R){
 let k=R.k;if(k==="leg")k=["sus","mae","cao","not"][rnd(4)];
 R.sub=k;let kind=Math.random()<.5?"bla":"pos";
 if(k==="cao"&&R.turn%3===2)kind="fur";
 R.intent=kind;R.hid=(k==="sus"&&Math.random()<.45);
 R.lie=(!R.hid&&R.fe/R.feMax<.35&&Math.random()<.4)?(kind==="pos"?"bla":"pos"):null;
}
function canFinal(R){return R.ok&&R.hp<=R.max*.5&&R.vo>=4}
function can(R,a){
 if(R.over)return false;
 if(a==="orar")return true;
 if(a==="agua")return R.water>0;
 if(a==="cruz")return R.vo>=1&&R.cd===0;
 if(a==="rit")return R.vo>=2;
 if(a==="fim")return canFinal(R);
 return false;
}
function playerAct(R,a,m){
 let dmg=0,t="";
 if(a!=="rit")R.ritu=0;
 if(a==="orar"){R.fe=Math.min(R.feMax,R.fe+4);R.vo=Math.min(R.voMax,R.vo+1);R.shield=6;t="Você reza. A chama se firma e um escudo de fé o cerca."}
 if(a==="agua"){R.water--;dmg=Math.round(14*m);R.po=Math.max(0,R.po-3);t="A água benta chia na pele dele."}
 if(a==="cruz"){R.vo--;R.stun=true;R.cd=2;dmg=4;t="O crucifixo o paralisa por um instante."}
 if(a==="rit"){R.vo-=2;dmg=Math.round((8+3*R.ritu)*m);R.ritu++;t="Você lê o Rituale. As palavras pesam no ar."}
 if(a==="fim"){R.vo-=4;dmg=Math.round(45*m);t="Você pronuncia o NOME. Ele grita com a própria voz."}
 R.hp-=dmg;R.last=a;R.dmg=dmg;
 if(R.hp<=0){R.hp=0;R.over="win"}
 return t+(dmg?` (−${dmg} Domínio)`:"");
}
function enemyAct(R){
 if(R.over)return "";
 const c=R.ci,base=2+c,pu=Math.max(3,7+c-Math.floor(R.mercy/2));let t="";
 if(R.stun){R.stun=false;t="Ele hesita, atordoado."}
 else{
  const hit=n=>{let d=n;const ab=Math.min(R.shield,d);d-=ab;R.shield-=ab;R.fe-=d;return d};
  if(R.intent==="bla"){const d=hit(base);t=d?`A blasfêmia queima sua alma (−${d} Fé).`:"Você resiste à blasfêmia: o escudo absorve tudo."}
  else if(R.intent==="fur"){const d=hit(base*2);t=d?`A fúria o atinge em cheio (−${d} Fé).`:"O escudo racha, mas segura a fúria."}
  else{R.po+=pu;t=`Ele força o corpo do hospedeiro (+${pu}% Possessão).`}
 }
 let pass=2-(R.mercy>=3?1:0);R.po+=pass;
 if(R.sub==="mae"){R.vo=Math.max(0,R.vo-1);t+=" A secura drena sua Vontade."}
 if(R.sub==="not"&&R.last!=="orar"){R.po+=3;t+=" A dívida cresce."}
 R.shield=0;R.turn++;R.cd=Math.max(0,R.cd-1);R.vo=Math.min(R.voMax,R.vo+1);
 if(R.fe<=0){R.fe=0;R.over="lose"}
 if(R.po>=100){R.po=100;R.over="lose"}
 if(!R.over)pickIntent(R);
 return t;
}
/* sinal da cruz: strokes = [[{x,y}...],[...]] ; sz = lado da área */
function crossScore(strokes,sz){
 if(strokes.length<2)return 0;
 const inf=strokes.slice(0,2).map(s=>{
  const a=s[0],b=s[s.length-1],dx=b.x-a.x,dy=b.y-a.y;let len=0;
  for(let i=1;i<s.length;i++)len+=Math.hypot(s[i].x-s[i-1].x,s[i].y-s[i-1].y);
  const xs=s.map(p=>p.x),ys=s.map(p=>p.y);
  return{dx,dy,len,ch:Math.hypot(dx,dy),x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};
 });
 let v=inf[0],h=inf[1];
 if(Math.abs(inf[1].dy)-Math.abs(inf[1].dx)>Math.abs(inf[0].dy)-Math.abs(inf[0].dx)){v=inf[1];h=inf[0]}
 const angV=Math.atan2(Math.abs(v.dx),Math.abs(v.dy))*57.3,angH=Math.atan2(Math.abs(h.dy),Math.abs(h.dx))*57.3;
 const sV=clamp(1-angV/35),sH=clamp(1-angH/35);
 const st=clamp((((v.ch/Math.max(v.len,1))+(h.ch/Math.max(h.len,1)))/2-.75)/.25);
 const sz2=clamp(Math.min(v.len,h.len)/(sz*.4));
 const vcx=(v.x0+v.x1)/2,hcy=(h.y0+h.y1)/2;
 const r=(hcy-v.y0)/Math.max(v.y1-v.y0,1),sPos=clamp(1-Math.abs(r-.38)/.45);
 const hx=(vcx-h.x0)/Math.max(h.x1-h.x0,1),sCov=clamp(1-Math.abs(hx-.5)/.5);
 return Math.round(100*(.25*sV+.25*sH+.15*st+.15*sz2+.1*sPos+.1*sCov));
}
</script>

<script id="game">
/* ===== ESTADO / OPÇÕES ===== */
const $=s=>document.querySelector(s);
let ST={vol:.8,vib:true,subs:true,calm:false,btn:false,cb:false};
let S={ch:0,def:[],saved:0,mercy:0,fx:0};
let G={found:{},choices:{},pick:null,mode:"title",rite:null};
const KEY="exorcismus_v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,ST}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){if(d.ST)Object.assign(ST,d.ST);return d.S||null}}catch(e){}return null}
function vib(p){if(ST.vib&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

/* ===== ÁUDIO: trilha caótica gerada ao vivo ===== */
const A={ctx:null,fear:.25,beat:0,cl:0};
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function cap(t){if(!ST.subs)return;const n=Date.now();if(n-A.cl<1400)return;A.cl=n;const e=$("#cap");e.textContent="["+t+"]";e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1300)}
function silentWav(){const n=800,b=new Uint8Array(44+n),d=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
 w(0,"RIFF");d.setUint32(4,36+n,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,"data");d.setUint32(40,n,true);b.fill(128,44);
 return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
function unlock(){
 try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
 try{if(!A.el){A.el=new Audio(silentWav());A.el.loop=true;A.el.volume=.01;A.el.setAttribute("playsinline","")}A.el.play().catch(()=>{})}catch(e){}
}
function au(){
 unlock();
 if(A.ctx){if(A.ctx.state!=="running")A.ctx.resume();return A.ctx}
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  const c=new C();A.ctx=c;c.resume&&c.resume();try{const sb=c.createBuffer(1,1,22050),ss=c.createBufferSource();ss.buffer=sb;ss.connect(c.destination);ss.start(0)}catch(e){}
  A.m=c.createGain();A.m.gain.value=ST.vol;
  const comp=c.createDynamicsCompressor();A.m.connect(comp);
  let out=c.destination;
  if(IOS&&c.createMediaStreamDestination){try{const md=c.createMediaStreamDestination();A.vel=new Audio();A.vel.srcObject=md.stream;A.vel.setAttribute("playsinline","");A.vel.play().catch(()=>{});out=md}catch(e){out=c.destination}}
  comp.connect(out);
  A.fx=c.createGain();A.fx.gain.value=.4;
  const dl=c.createDelay(1);dl.delayTime.value=.43;const fb=c.createGain();fb.gain.value=.55;
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1600;
  A.fx.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(A.m);
  const len=c.sampleRate*2,nb=c.createBuffer(1,len,c.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.nb=nb;
  A.dr=[55,58.3,82.4,116.5].map(f=>{
   const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f;
   const g=c.createGain();g.gain.value=.03;const fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=240;
   o.connect(fl);fl.connect(g);g.connect(A.m);o.start();return{o,fl,f};});

  x.fillStyle=g;x.fillRect(0,0,160,120);
  x.globalAlpha=.12;disc(mouse.x,mouse.y,Math.round(rad*.5),"#ffb050");x.globalAlpha=1;
  drawEyes(mouse.x,mouse.y,true);
 }else{drawTitle();spawnEyes(.5);drawEyes(0,0,false)}
 if(A.fear>.55&&!ST.calm&&Math.random()<.03){const yy=rnd(110),hh=2+rnd(8),dx=(Math.random()-.5)*10;x.drawImage(cv,0,yy,160,hh,dx,yy,160,hh)}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function scare(){
 if(ST.calm){flash=.3;return}
 sfx("scare");vib([80,40,120]);cap("grito agudo");SC={t:.28};$("#app").classList.remove("shake");void $("#app").offsetWidth;$("#app").classList.add("shake");
}
let scareT=null;
function armScare(){clearTimeout(scareT);if(ST.calm)return;scareT=setTimeout(()=>{if(G.mode==="explore"){scare();}},16000+rnd(16000))}

/* ===== TELAS ===== */
const ui=$("#ui");
function title(){
 G.mode="title";clearTimeout(scareT);const sv=load();
 ui.innerHTML=`<h1>Exorcismus</h1><p class="sub">RPG de terror gótico · Santa Clara do Ermo, 1962</p>
 <button class="b" onclick="newGame()">NOVO JOGO</button>
 ${sv?`<button class="b g" onclick="cont()">CONTINUAR (Caso ${["I","II","III","IV","V"][sv.ch]})</button>`:""}
 <button class="b g" onclick="openOpts()">OPÇÕES</button>
 <p class="sub" style="margin-top:12px">Use fones de ouvido, no escuro. Toque em “Novo jogo” para ligar o som. No iPhone, desligue o modo silencioso (chavinha lateral) e aumente o volume.</p>`;
}
function newGame(){au();sfx("click");S={ch:0,def:[],saved:0,mercy:0,fx:0};save();
 G.mode="title";ui.innerHTML=`<h2>Prólogo</h2><div class="box"><p>Minas Gerais, 1962. O velho Padre Benedito, exorcista de Santa Clara do Ermo, foi encontrado morto, e ninguém quer explicar como.</p><p>Você, Padre Tomás Aurélio, 28 anos, chega para substituí-lo. Na primeira noite, a sineta da igreja toca sozinha.</p><p>Você não tem arma nenhuma. Só a fé, e ela anda curta.</p></div><button class="b" onclick="startCase()">ENTRAR NA VILA</button>`}
function cont(){au();const s=load();if(s){S=s;startCase()}}
function startCase(){
 sfx("click");au();G.found={};G.choices={};G.pick=null;G.rite=null;G.mode="explore";mouse.tx=60;mouse.ty=70;eyes=[];armScare();save();exploreUI();
}
function nFound(){return Object.keys(G.found).length}
function exploreUI(msg){
 const c=CASES[S.ch];
 ui.innerHTML=`<h2>${c.t}</h2>
 <div class="box">${msg||`<p>${c.intro}</p><p style="color:#8c91ad;font-size:12px">Arraste o dedo (ou o mouse) sobre a cena para mover a luz da vela. Os pontos dourados são sinais. Toque neles.</p>`}</div>
 <div class="sub">Sinais encontrados: ${nFound()}/${c.objs.length}</div>
 ${c.objs.map((o,i)=>`<button class="b g" onclick="examine(${i})">${G.found[o.n]?"✔ ":""}${o.k==="npc"?"Falar com":"Examinar"}: ${o.n}</button>`).join("")}
 <button class="b" onclick="diary()" ${nFound()<2?"disabled":""}>ABRIR O DIÁRIO ${nFound()<2?"(ache 2 sinais)":""}</button>`;
}
function examine(i){
 sfx("click");const c=CASES[S.ch],o=c.objs[i];
 G.found[o.n]=true;mouse.tx=o.x;mouse.ty=88;
 if(o.k==="obj"&&Math.random()<.35){const m=Math.random()<.5;cap("algo se move")}
 let h=`<p><b>${o.n}</b></p><p>${o.tx}</p><div class="cl">📖 Sinal anotado: ${o.cl}</div>`;
 if(o.ch&&G.choices[o.n]==null){
  h+=`<p style="margin-top:8px"><i>${o.ch.q}</i></p>`+o.ch.o.map((q,j)=>`<button class="b g" onclick="choose(${i},${j})">${q.t}</button>`).join("");
  exploreUI(h);ui.querySelectorAll(".b").forEach(b=>{if(!b.textContent.match(/Abrir|ABRIR/)&&b.onclick&&b.getAttribute("onclick").startsWith("examine"))b.disabled=true});return;
 }
 exploreUI(h);
}
function choose(i,j){
 const o=CASES[S.ch].objs[i],q=o.ch.o[j];sfx("click");G.choices[o.n]=j;S.mercy+=q.m;save();
 exploreUI(`<p><b>${o.n}</b></p><p>${q.r}</p>`);
}
function diary(){
 sfx("click");G.mode="diary";const c=CASES[S.ch];
 ui.innerHTML=`<div class="box pap"><h2>DIÁRIO DO PADRE TOMÁS</h2><p><b>Hospedeiro:</b> ${c.host}</p>
 ${c.objs.filter(o=>G.found[o.n]).map(o=>`<div class="cl" style="border-color:#6b1020">${o.cl}</div>`).join("")}
 <p style="margin-top:10px"><b>Qual é o verdadeiro nome do demônio?</b> Os já exorcizados não voltam. Errar o nome o deixa mais forte e bloqueia o Rito Final.</p>
 ${Object.keys(DEM).map(k=>{const dead=S.def.includes(k);return`<div class="dem ${dead?"off":""} ${G.pick===k?"on":""}" ${dead?"":`onclick="pick('${k}')"`}><b>${DEM[k].n}${dead?" (exorcizado)":""}</b><small>${DEM[k].d}</small></div>`}).join("")}
 </div>
 <button class="b" onclick="startRite()" ${G.pick?"":"disabled"}>INICIAR O RITO</button>
 <button class="b g" onclick="G.mode='explore';exploreUI()">VOLTAR À INVESTIGAÇÃO</button>`;
}
function pick(k){sfx("click");G.pick=k;diary()}
function feMax(){return 14+2*S.saved}
function startRite(){
 sfx("holy");G.mode="rite";clearTimeout(scareT);
 G.rite=newRite(S.ch,G.pick===CASES[S.ch].id,S.mercy,feMax());G.rite.warned=false;
 riteUI(`O ar fica pesado. <b>${DEM[G.pick].n}</b> ${G.pick===CASES[S.ch].id?"reconhece o seu olhar.":"ri: o nome estava errado."}`);
}
const bar=(l,v,m,c)=>`<div class="bar"><span>${l}</span><i><b style="width:${clamp(v/m)*100}%;background:${c}"></b></i><em>${Math.round(v)}/${m}</em></div>`;
function riteUI(log){
 const r=G.rite,d=DEM[r.k];
 const shown=r.hid?"…a voz embaralha as intenções dele…":LBL[r.lie||r.intent]+(r.lie?" (?)":"");
 const b=(a,l,s)=>`<button class="b ${a==="fim"?"":"g"}" ${can(r,a)?"":"disabled"} onclick="act('${a}')">${l}<br><small style="font-weight:400">${s}</small></button>`;
 ui.innerHTML=`<h2>${CASES[r.ci].t.split("·")[1]} · ${d.n}</h2>
 ${bar("Fé",r.fe,r.feMax,"#e0b252")}${bar("Vontade",r.vo,r.voMax,"#5d8be0")}${bar("Domínio",r.hp,r.max,"#c0243c")}${bar("Possessão",r.po,100,"#8a3ad0")}
 <div class="int ${r.fe/r.feMax<.35?"gl":""}">${shown}</div>
 <div class="log">${log||""}</div>
 <div class="row"><div style="flex:1">${b("orar","🙏 Orar","+Fé, escudo")}${b("cruz","✝ Crucifixo","atordoa · −1 Vont")}</div><div style="flex:1">${b("agua","💧 Água benta","dano · "+r.water+" restantes")}${b("rit","📖 Rituale","dano crescente · −2 Vont")}</div></div>
 <button class="b" ${can(r,"fim")?"":"disabled"} onclick="act('fim')">☩ RITO FINAL <small style="font-weight:400">${!r.ok?"(nome errado: bloqueado)":r.hp>r.max*.5?"(enfraqueça-o abaixo de 50%)":"−4 Vont"}</small></button>`;
}
const DMG={agua:1,rit:1,fim:1};
function act(a){
 const r=G.rite;if(!can(r,a))return;sfx("click");
 if(DMG[a]){
  if(ST.btn){resolve(a,1.25,75)}else crossUI(acc=>resolve(a,.5+acc/100,acc));
 }else resolve(a,1);
}
function resolve(a,m,acc){
 const r=G.rite;
 const t1=playerAct(r,a,m)+(acc!=null?` Precisão da cruz: ${acc}%.`:"");
 if(a==="orar")sfx("holy");else if(a==="agua")sfx("fire");else sfx("hit");
 flash=.35;vib(40);
 if(r.over==="win")return endRite(t1);
 const t2=enemyAct(r);
 if(r.intent==="fur"||/pesad|FÚRIA|atinge/.test(t2)){shake=.4}
 if(/Fé\)/.test(t2)){sfx("hit");vib(80);shake=.3}
 if(r.over==="lose")return endRite(t1+" "+t2);
 if(!r.warned&&r.fe/r.feMax<.3){r.warned=true;if(!ST.calm)scare();cap("batimentos")}
 riteUI(t1+"<br>"+t2);
}
function endRite(last){
 const r=G.rite;G.mode="rite";
 if(r.over==="win"){
  const saved=r.po<70;if(saved)S.saved++;S.def.push(r.k);save();sfx("win");
  const c=CASES[S.ch],end=S.ch===4;
  ui.innerHTML=`<h2>O nome foi dito. ${DEM[r.k].n} se desfaz.</h2><div class="box"><p>${last}</p><p>${saved?`<b>${c.host.split(",")[0]} foi salvo(a).</b> A gratidão fortalece sua fé (+2 Fé máx).`:`<b>${c.host.split(",")[0]} sobrevive, mas marcado(a).</b> A possessão foi longe demais.`}</p></div>
  <div class="box pap"><h2>Página do diário recuperada</h2><p><i>${c.page}</i></p></div>
  <button class="b" onclick="${end?"ending()":"nextCase()"}">${end?"O AMANHECER":"SEGUIR PARA O PRÓXIMO CASO"}</button>`;
 }else{
  sfx("lose");const why=r.fe<=0?"Sua Fé se apagou.":"O hospedeiro foi tomado por completo.";
  ui.innerHTML=`<h2 class="gl">O exorcismo falhou.</h2><div class="box"><p>${last}</p><p><b>${why}</b></p></div>
  <button class="b" onclick="retry()">TENTAR O RITO DE NOVO</button><button class="b g" onclick="G.mode='explore';diary()">REVISAR O DIÁRIO E O NOME</button>`;
 }
}
function retry(){startRite()}
function nextCase(){S.ch++;save();startCase()}
function ending(){
 sfx("holy");G.mode="title";
 const sv=S.saved,m=S.mercy;let t,txt;
 if(sv>=4&&m>=3){t="Redenção";txt="O pacto se rompe com a verdade, não com a força. Santa Clara do Ermo amanhece sem neblina. Pela primeira vez, a sineta toca porque alguém a puxou. Tomás finalmente acredita.";}
 else if(sv>=2){t="Cicatrizes";txt="A vila está livre, mas lembra. Há marcas nas pessoas, e fios de cinza nas paredes da Matriz. Tomás fica. Alguém precisa vigiar o que ficou pelo caminho.";}
 else{t="A dívida continua";txt="O sol nasce, e Tomás sorri aliviado. Então ouve, bem baixinho, atrás da própria orelha, uma voz amável que conhece o seu nome. Ele não grita. Ele cochicha.";}
 ui.innerHTML=`<h1 style="font-size:34px">${t}</h1><div class="box"><p>${txt}</p><p style="color:#8c91ad">Salvos: ${sv}/5 · Compaixão: ${m}/5</p></div><button class="b" onclick="newGame()">JOGAR DE NOVO</button><button class="b g" onclick="title()">MENU</button>`;
}

/* ===== SINAL DA CRUZ ===== */
function crossUI(cb){
 const o=$("#cross");o.style.display="flex";
 o.innerHTML=`<h2>Trace o sinal da cruz</h2><p class="sub">Um traço de cima para baixo e outro da esquerda para a direita. Quanto mais certo, maior o dano.</p><canvas id="cc" width="320" height="320"></canvas><div id="ca" class="sub" style="height:22px;margin-top:8px"></div><div class="row" style="width:min(80vw,320px)"><button class="b g" id="cl">Limpar</button><button class="b g" id="cb2">Usar botão (75%)</button></div>`;
 const c=$("#cc"),g=c.getContext("2d");let strokes=[],cur=null,done=false;
 const redraw=()=>{g.clearRect(0,0,320,320);g.strokeStyle="#e0b252";g.shadowColor="#e0b252";g.shadowBlur=12;g.lineWidth=5;g.lineCap="round";g.lineJoin="round";
  strokes.concat(cur?[cur]:[]).forEach(s=>{g.beginPath();s.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke()})};
 const pt=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*320,y:(e.clientY-r.top)/r.height*320}};
 const finish=acc=>{done=true;$("#ca").textContent=`Precisão: ${acc}%`;setTimeout(()=>{o.style.display="none";cb(acc)},650)};
 c.onpointerdown=e=>{if(done||strokes.length>=2)return;c.setPointerCapture(e.pointerId);cur=[pt(e)];redraw()};
 c.onpointermove=e=>{if(cur){cur.push(pt(e));redraw()}};
 c.onpointerup=()=>{if(!cur)return;if(cur.length>3)strokes.push(cur);cur=null;redraw();if(strokes.length===2)finish(crossScore(strokes,320))};
 $("#cl").onclick=()=>{if(!done){strokes=[];cur=null;redraw()}};
 $("#cb2").onclick=()=>{if(!done)finish(75)};
}

/* ===== OPÇÕES ===== */
function openOpts(){
 const o=$("#opt");o.style.display="flex";
 const t=(k,l)=>`<label>${l}<input type="checkbox" ${ST[k]?"checked":""} onchange="ST['${k}']=this.checked;optApply()"></label>`;
 o.innerHTML=`<h2>Opções</h2><label>Volume<input type="range" min="0" max="1" step=".05" value="${ST.vol}" oninput="ST.vol=+this.value;vol();optApply(1)"></label>
 ${t("vib","Vibração")}${t("subs","Legendas de efeitos sonoros")}${t("calm","Reduzir sustos (sem flashes e jumpscares)")}${t("btn","Cruz por botão (sem gesto)")}${t("cb","Modo daltônico")}
 <button class="b g" onclick="testSound()">🔊 TESTAR SOM</button><p class="sub" id="snd" style="margin-top:6px"></p>
 <p class="sub" style="margin-top:10px">Idioma: Português (BR)</p><button class="b" onclick="$('#opt').style.display='none'">VOLTAR</button>`;
}
function testSound(){
 const c=au();sfx("holy");setTimeout(()=>sfx("hit"),700);
 const e=$("#snd");if(!e)return;
 setTimeout(()=>{e.textContent=!c?"Este navegador não suporta áudio Web.":("Estado do áudio: "+A.ctx.state+(IOS?(A.vel&&!A.vel.paused?" · saída iOS ativa":" · saída iOS parada"):"")+(A.ctx.state==="running"?" (se não ouviu nada: desligue o modo silencioso e suba o volume)":" (toque no botão de novo)"))},300);
}
function optApply(q){document.body.classList.toggle("cb",ST.cb);if(!q)save()}
optApply(1);
["pointerdown","touchend","click"].forEach(ev=>document.addEventListener(ev,()=>{if(A.vel&&A.vel.paused)A.vel.play().catch(()=>{});if(A.ctx&&A.ctx.state!=="running")au()},{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&A.ctx&&A.ctx.state!=="running")A.ctx.resume()});
title();
window.__dbg={S,G,ST,examine,diary,pick,startRite,act,resolve,newGame,startCase};
</script>
